<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多段式視覺節拍器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #2c3e50; margin-top: 0; }
        
        /* 顯示面板 */
        .display-panel {
            background: #2c3e50;
            color: #fff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
        }
        .display-box {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .display-label { font-size: 0.9rem; color: #bdc3c7; margin-bottom: 5px; }
        .display-value { font-size: 1.8rem; font-weight: bold; font-family: monospace; letter-spacing: 2px; }
        .display-value.active { color: #2ecc71; }
        .display-value.ready-active { color: #f39c12; }

        /* 節拍軌跡視覺化樣式 */
        .beat-tracker {
            font-family: "Courier New", Courier, monospace;
            font-size: 2.5rem;
            color: #576574; /* 未啟動時的暗色 */
            letter-spacing: 4px;
            word-break: break-all;
        }
        .beat-tracker .highlight {
            color: #2ecc71; /* 正式段落：亮綠色 */
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
        }
        .beat-tracker .highlight-ready {
            color: #f39c12; /* 預備拍段落：亮橘色 */
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.6);
        }

        /* 控制按鈕 */
        .controls { text-align: center; margin-bottom: 25px; }
        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background: #2ecc71; color: white; }
        .btn-primary:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #34495e; color: white; margin-top: 10px; }
        .btn-secondary:hover { background: #2c3e50; }
        
        /* 段落設定區 */
        .section-list { margin-bottom: 20px; }
        .section-item {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            position: relative;
        }
        .section-item.ready-section {
            border-left: 5px solid #f39c12;
            background: #fffbf2;
        }
        .section-title { font-weight: bold; color: #34495e; margin-bottom: 10px; display: flex; justify-content: space-between;}
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        .form-grid.ready-grid {
            grid-template-columns: 1fr 2fr;
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 4px; }
        .form-group input, .form-group select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .form-group input:disabled, .form-group select:disabled {
            background: #e2e8f0;
            color: #7f8c8d;
        }
        .remove-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>多段式視覺節拍器</h1>

    <!-- 即時狀態顯示面版 -->
    <div class="display-panel">
        <div class="display-box">
            <div class="display-label">目前小節 (Bar)</div>
            <div class="display-value" id="current-bar">--</div>
        </div>
        <div class="display-box">
            <div class="display-label">目前拍數軌跡 (Beat Tracker)</div>
            <div class="beat-tracker" id="current-beat-tracker">------</div>
        </div>
    </div>

    <!-- 播放主控制項 -->
    <div class="controls">
        <button id="start-stop-btn" class="btn btn-primary">開始播放</button>
    </div>

    <hr>

    <!-- 預備拍設定（固定不滅） -->
    <h3>預備倒數設定</h3>
    <div class="section-item ready-section">
        <div class="section-title" style="color: #d35400;">
            <span>⚠️ 預備拍 (Count-in)</span>
        </div>
        <div class="form-grid ready-grid">
            <div class="form-group">
                <label>預備長度</label>
                <select id="ready-bars-select">
                    <option value="1">倒數 1 小節</option>
                    <option value="2" selected>倒數 2 小節</option>
                </select>
            </div>
            <div class="form-group">
                <label>提示</label>
                <input type="text" value="自動同步段落 #1 的拍數與速度，預備拍固定以 1/4 音符提示" disabled>
            </div>
        </div>
    </div>

    <!-- 節拍設定段落 -->
    <h3>正式節拍段落編排</h3>
    <div id="section-container" class="section-list">
        <!-- 動態生成的段落會放在這裡 -->
    </div>
    <button id="add-section-btn" class="btn btn-secondary">+ 新增段落</button>
</div>

<script>
    // 預設兩段範例資料
    let sectionsData = [
        { startBar: 1, endBar: 4, beatsPerBar: 4, bpm: 120, rhythm: "2" }
	];

    // 預備拍控制變數
    let readyBarsSetting = 2; // 由 UI 控制
    let isReadyStage = false; // 是否處於預備拍階段
    let readyBarCounter = 0;  // 預備拍內部的小節計數器 (例如：-2, -1)

    // Web Audio 相關變數
    let audioCtx = null;
    let isPlaying = false;
    let currentBar = 1;
    let currentBeat = 0; 
    let currentSubBeat = 0; 
    let nextNoteTime = 0.0; 
    let timerId = null;

    // 排程設定
    const lookahead = 25.0; 
    const scheduleAheadTime = 0.1; 

    // DOM 元素
    const sectionContainer = document.getElementById('section-container');
    const addSectionBtn = document.getElementById('add-section-btn');
    const startStopBtn = document.getElementById('start-stop-btn');
    const currentBarDisplay = document.getElementById('current-bar');
    const currentBeatTracker = document.getElementById('current-beat-tracker');
    const readyBarsSelect = document.getElementById('ready-bars-select');

    function init() {
        renderSections();
        addSectionBtn.addEventListener('click', addSection);
        startStopBtn.addEventListener('click', togglePlay);
        readyBarsSelect.addEventListener('change', (e) => {
            readyBarsSetting = parseInt(e.target.value);
        });
        readyBarsSetting = parseInt(readyBarsSelect.value);
    }

    function renderSections() {
        sectionContainer.innerHTML = '';
        sectionsData.forEach((sec, index) => {
            const div = document.createElement('div');
            div.className = 'section-item';
            div.innerHTML = `
                <div class="section-title">
                    <span>段落 #${index + 1}</span>
                    ${sectionsData.length > 1 ? `<button class="remove-btn" onclick="removeSection(${index})">刪除</button>` : ''}
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>起始小節</label>
                        <input type="number" value="${sec.startBar}" min="1" onchange="updateData(${index}, 'startBar', this.value)">
                    </div>
                    <div class="form-group">
                        <label>結束小節</label>
                        <input type="number" value="${sec.endBar}" min="1" onchange="updateData(${index}, 'endBar', this.value)">
                    </div>
                    <div class="form-group">
                        <label>每小節幾拍</label>
                        <select onchange="updateData(${index}, 'beatsPerBar', this.value)">
                            <option value="2" ${sec.beatsPerBar==2?'selected':''}>2 拍</option>
                            <option value="3" ${sec.beatsPerBar==3?'selected':''}>3 拍</option>
                            <option value="4" ${sec.beatsPerBar==4?'selected':''}>4 拍</option>
                            <option value="6" ${sec.beatsPerBar==6?'selected':''}>6 拍</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>拍速 (BPM)</label>
                        <input type="number" value="${sec.bpm}" min="30" max="300" onchange="updateData(${index}, 'bpm', this.value)">
                    </div>
                    <div class="form-group">
                        <label>細分節拍</label>
                        <select onchange="updateData(${index}, 'rhythm', this.value)">
                            <option value="1" ${sec.rhythm=='1'?'selected':''}>1/4 音符 (1 2 3 4)</option>
                            <option value="2" ${sec.rhythm=='2'?'selected':''}>1/8 音符 (1. 2. 3. 4.)</option>
                            <option value="3" ${sec.rhythm=='3'?'selected':''}>三連音 (1.. 2.. 3.. 4..)</option>
                            <option value="4" ${sec.rhythm=='4'?'selected':''}>1/16 音符 (1... 2... 3... 4...)</option>
                            <option value="dotted" ${sec.rhythm=='dotted'?'selected':''}>正附點 (1--. 2--.)</option>
                            <option value="rev_dotted" ${sec.rhythm=='rev_dotted'?'selected':''}>反附點 (1.-- 2.--)</option>
                        </select>
                    </div>
                </div>
            `;
            sectionContainer.appendChild(div);
        });
    }

    function addSection() {
        const lastSec = sectionsData[sectionsData.length - 1];
        const nextStart = lastSec ? parseInt(lastSec.endBar) + 1 : 1;
        sectionsData.push({
            startBar: nextStart,
            endBar: nextStart + 3,
            beatsPerBar: 4,
            bpm: 120,
            rhythm: "1"
        });
        renderSections();
    }

    window.removeSection = function(index) {
        sectionsData.splice(index, 1);
        renderSections();
    }

    window.updateData = function(index, field, value) {
        sectionsData[index][field] = (field === 'rhythm') ? value : parseInt(value);
    }

    function getSettingForBar(bar) {
        let matched = sectionsData.find(sec => bar >= sec.startBar && bar <= sec.endBar);
        return matched || sectionsData[sectionsData.length - 1];
    }

    function getRhythmDetails(rhythmStr) {
        if (isReadyStage) {
            return { count: 1, weights: [1.0] }; // 預備拍一律只打 1/4 音符正拍
        }
        switch(rhythmStr) {
            case "1":          return { count: 1, weights: [1.0] };
            case "2":          return { count: 2, weights: [0.5, 0.5] };
            case "3":          return { count: 3, weights: [1/3, 1/3, 1/3] };
            case "4":          return { count: 4, weights: [0.25, 0.25, 0.25, 0.25] };
            case "dotted":     return { count: 2, weights: [0.75, 0.25] };
            case "rev_dotted": return { count: 2, weights: [0.25, 0.75] };
            default:           return { count: 1, weights: [1.0] };
        }
    }

    function playTone(time, frequency, duration) {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(frequency, time);
        gainNode.gain.setValueAtTime(0.8, time);
        gainNode.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc.start(time);
        osc.stop(time + duration);
    }

    // 計算下一個發聲點與進程控制
    function nextNote() {
        // 預備拍參照段落 #1 的速度與拍號
        let currentSetting = isReadyStage ? sectionsData[0] : getSettingForBar(currentBar);
        const details = getRhythmDetails(currentSetting.rhythm);
        const secondsPerBeat = 60.0 / currentSetting.bpm;

        const currentWeight = details.weights[currentSubBeat];
        nextNoteTime += secondsPerBeat * currentWeight;

        currentSubBeat++;
        if (currentSubBeat >= details.count) {
            currentSubBeat = 0;
            currentBeat++;
            
            if (currentBeat >= currentSetting.beatsPerBar) {
                currentBeat = 0;
                
                if (isReadyStage) {
                    readyBarCounter++;
                    if (readyBarCounter > readyBarsSetting) {
                        // 預備拍結束，正式進入段落 #1
                        isReadyStage = false;
                        currentBar = sectionsData[0].startBar;
                    }
                } else {
                    currentBar++;
                    const maxBar = Math.max(...sectionsData.map(s => s.endBar));
                    if (currentBar > maxBar) {
                        currentBar = sectionsData[0].startBar; // 循環
                    }
                }
            }
        }
    }

    // 渲染帶有高亮顏色的節拍字串
// 渲染帶有高亮顏色的節拍字串（已修正反附點視覺邏輯）
    function updateVisualTracker(bar, beat, subBeat, inReadyStage, readyCounter) {
        let currentSetting = inReadyStage ? sectionsData[0] : getSettingForBar(bar);
        const totalBeats = currentSetting.beatsPerBar;
        const rType = inReadyStage ? "1" : currentSetting.rhythm;
        
        let htmlOutput = "";
        let globalElementIndex = 0;
        let targetIndex = 0;
        
        const highlightClass = inReadyStage ? "highlight-ready" : "highlight";
        
        for (let b = 0; b < totalBeats; b++) {
            const beatNum = b + 1;
            let segments = [];
            
            if (rType === "1") segments = [beatNum.toString()];
            if (rType === "2") segments = [beatNum.toString(), "."];
            if (rType === "3") segments = [beatNum.toString(), ".", "."];
            if (rType === "4") segments = [beatNum.toString(), ".", ".", "."];
            if (rType === "dotted")     segments = [beatNum.toString(), "_", "_", "."]; // 正附點 1--.
            if (rType === "rev_dotted") segments = [beatNum.toString(), ".", "_", "_"]; // 反附點 1.--
            
            // 【核心修正點】精準定位正附點與反附點的亮點位置
            if (b === beat) {
                if (rType === "1") {
                    targetIndex = globalElementIndex;
                } else if (rType === "2" || rType === "3" || rType === "4") {
                    targetIndex = globalElementIndex + subBeat;
                } else if (rType === "dotted") {
                    // 正附點 (長短)：第一個音在第1個字元(subBeat=0)，第二個音在第4個字元(subBeat=1)
                    targetIndex = globalElementIndex + (subBeat === 0 ? 0 : 3);
                } else if (rType === "rev_dotted") {
                    // 反附點 (短長)：第一個音在第1個字元(subBeat=0)，第二個音在第2個字元(subBeat=1)
                    targetIndex = globalElementIndex + (subBeat === 0 ? 0 : 1);
                }
            }
            
            segments.forEach(char => {
                if (globalElementIndex === targetIndex && b === beat) {
                    htmlOutput += `<span class="${highlightClass}">${char}</span>`;
                } else {
                    htmlOutput += `<span>${char}</span>`;
                }
                globalElementIndex++;
            });
            
            if (b < totalBeats - 1) {
                htmlOutput += " ";
            }
        }
        
        currentBeatTracker.innerHTML = htmlOutput;

        if (inReadyStage) {
            let remainingBars = readyBarsSetting - readyCounter + 1;
            currentBarDisplay.textContent = `Ready (${remainingBars})`;
        } else {
            currentBarDisplay.textContent = bar;
        }
    }

    function scheduleNote(bar, beat, subBeat, time, inReadyStage, readyCounter) {
        let currentSetting = inReadyStage ? sectionsData[0] : getSettingForBar(bar);
        
        // 聲音排程
        if (subBeat === 0) {
            if (beat === 0) {
                // 每小節第一拍：預備拍給低一點的木魚聲(800Hz)，正式拍給清脆聲(1000Hz)
                playTone(time, inReadyStage ? 1500 : 1800, 0.15); 
            } else {
                playTone(time, inReadyStage ? 750 : 900, 0.1); 
            }
        } else {
            playTone(time, 440, 0.05); 
        }

        // 精準視覺同步
        const delay = (time - audioCtx.currentTime) * 1000;
        setTimeout(() => {
            if (!isPlaying) return;
            
            // 呼叫高亮視覺渲染器
            updateVisualTracker(bar, beat, subBeat, inReadyStage, readyCounter);
            
            if(beat === 0 && subBeat === 0) {
                const pulseClass = inReadyStage ? 'ready-active' : 'active';
                currentBarDisplay.className = `display-value ${pulseClass}`;
                setTimeout(() => currentBarDisplay.className = 'display-value', 100);
            }
        }, delay);
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
            // 傳入當前的階段狀態快照，確保非同步 UI 渲染正確
            scheduleNote(currentBar, currentBeat, currentSubBeat, nextNoteTime, isReadyStage, readyBarCounter);
            nextNote();
        }
        timerId = setTimeout(scheduler, lookahead);
    }

    function togglePlay() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        isPlaying = !isPlaying;

        if (isPlaying) {
            // 啟動預備拍階段
            isReadyStage = true;
            readyBarCounter = 1; 
            currentBeat = 0;
            currentSubBeat = 0;
            
            nextNoteTime = audioCtx.currentTime + 0.05;
            startStopBtn.textContent = "停止";
            startStopBtn.className = "btn btn-danger";
            scheduler();
        } else {
            clearTimeout(timerId);
            isReadyStage = false;
            startStopBtn.textContent = "開始播放";
            startStopBtn.className = "btn btn-primary";
            currentBarDisplay.textContent = "--";
            currentBeatTracker.innerHTML = "------";
        }
    }

    init();
</script>

</body>
</html>
